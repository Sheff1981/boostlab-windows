name: Windows CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/BoostLab.Windows/BoostLab.Windows.csproj -p:Platform=x64

      - name: Build
        run: dotnet build src/BoostLab.Windows/BoostLab.Windows.csproj -c Release -p:Platform=x64 --no-restore
